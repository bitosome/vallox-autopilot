name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci
      - run: npm run check
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s test -p 'test_*.py' -v
      - run: git diff --exit-code -- custom_components/vallox_autopilot/www/vallox-autopilot-card.js
      - name: Package integration
        working-directory: custom_components
        run: zip -r ../vallox-autopilot.zip vallox_autopilot -x '*/__pycache__/*' '*.pyc'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vallox-autopilot.zip custom_components/vallox_autopilot/www/vallox-autopilot-card.js --generate-notes --verify-tag
